[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-neo4j-memory-plugin"
version = "0.1.0"
description = "Neo4j graph-backed memory plugin for Hermes Agent"
requires-python = ">=3.10"
dependencies = [
    "neo4j-agent-memory>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neo4j_memory*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: marks tests that require a live Neo4j instance (deselect with '-m not integration')",
]
addopts = "-m 'not integration'"

[tool.ruff.lint]
# Name the rule set explicitly. CI installs the latest ruff, and its default
# selection changes between releases; this keeps the original intent
# (pyflakes plus core pycodestyle) independent of the installed version.
select = ["E4", "E7", "E9", "F"]
