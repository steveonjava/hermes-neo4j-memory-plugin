name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ------------------------------------------------------------------
  # Lint / formatting (ruff) — runs on latest Python, no service deps
  # ------------------------------------------------------------------
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check (lint)
        run: ruff check .
      - name: ruff format --check (formatting)
        run: ruff format --check .

  # ------------------------------------------------------------------
  # Unit tests — Python 3.10 / 3.11 / 3.12, no external services
  # ------------------------------------------------------------------
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -v

  # ------------------------------------------------------------------
  # Integration tests — Python 3.11, Neo4j 5.20 service container
  #
  # Startup strategy:
  #   1. GitHub's service container health check confirms Neo4j's HTTP
  #      admin port (7474) is up.
  #   2. An explicit Bolt-readiness step polls port 7687 before pytest
  #      runs, because Bolt may lag a few seconds behind HTTP.
  #
  # Credentials: test-only (neo4j/testpassword). No real secrets.
  #
  # addopts override: pyproject.toml sets addopts = "-m 'not integration'"
  # so that `pytest` without flags stays fast. CI clears that via
  # --override-ini to select integration tests explicitly.
  # ------------------------------------------------------------------
  integration:
    name: Integration tests (Neo4j)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # Wait for the Bolt port to be ready (HTTP health above doesn't guarantee it)
      - name: Wait for Neo4j Bolt (port 7687)
        run: |
          python3 - <<'EOF'
          import socket, time, sys
          deadline = time.time() + 90
          while time.time() < deadline:
              try:
                  s = socket.create_connection(("localhost", 7687), timeout=2)
                  s.close()
                  print("Bolt port 7687 is ready")
                  sys.exit(0)
              except OSError:
                  time.sleep(2)
          print("ERROR: Bolt port 7687 never became available", file=sys.stderr)
          sys.exit(1)
          EOF

      - name: Run integration tests
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: testpassword
        run: |
          pytest tests/integration/ -v \
            -m integration \
            --override-ini="addopts=" \
            --run-integration
